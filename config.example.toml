# ========================================================================
[[topics]]
name = "technology"

# Items are taken round-robin from each feed, up to max_items_per_topic.
# List the most important feed first.
[[topics.feeds]]
name = "Tech Feed"
url = "https://example.com/tech.xml"

[[topics.feeds]]
name = "Tech Feed 2"
url = "https://example.com/tech2.xml"

[[topics]]
name = "politics"

[[topics.feeds]]
name = "Politics Feed"
url = "https://example.com/politics.xml"

[[topics]]
name = "finance"

[[topics.feeds]]
name = "Finance Feed"
url = "https://example.com/finance.xml"

# ========================================================================
# Recipients
# ========================================================================
[[recipients]]
chat_id = 1234567890
topics = ["technology", "politics", "finance"]
