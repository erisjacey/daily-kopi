name: Daily digest

permissions:
  contents: read

on:
  schedule:
    # Runs every day at 07:00 SGT
    - cron: "0 7 * * *"
      timezone: Asia/Singapore

  workflow_dispatch:

  push:
    branches:
      - feat/7-daily-schedule

jobs:
  send-digest:
    name: Send digest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Write config file
        env:
          CONFIG_TOML: ${{ secrets.CONFIG_TOML }}
        run: |
          echo "$CONFIG_TOML" > config.toml

      - name: Build and run Go program
        env:
          TZ: Asia/Singapore
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: go run .
